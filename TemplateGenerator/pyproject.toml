[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pawmarvel-template-generator"
version = "0.1.0"
description = "Generate personalized pet T-shirt artwork with GPT Image 2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=2.48.0,<3", "Pillow"]

[project.scripts]
pawmarvel-generate = "pawmarvel_generator.cli:main"
pawmarvel-layout-config = "pawmarvel_generator.layout_cli:main"
pawmarvel-name-prompt = "pawmarvel_generator.name_prompt_cli:main"
pawmarvel-render = "pawmarvel_generator.render_cli:main"
pawmarvel-poc-run = "pawmarvel_generator.poc_runner:main"
pawmarvel-pipeline = "pawmarvel_generator.pipeline_cli:main"
pawmarvel-upscale = "pawmarvel_generator.upscale_cli:main"
pawmarvel-upscale-template = "pawmarvel_generator.upscale_template_cli:main"
pawmarvel-upscale-pet = "pawmarvel_generator.upscale_pet_cli:main"
pawmarvel-product-profile = "pawmarvel_generator.profile_cli:main"
pawmarvel-bundle = "pawmarvel_generator.bundle_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pawmarvel_generator = ["static/*.html", "static/*.js", "static/*.css"]
