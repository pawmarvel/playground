[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pawmarvel-static-print-design"
version = "0.1.0"
description = "Author, review, package, and publish immutable static print designs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=11", "openai>=2.6"]

[project.optional-dependencies]
test = ["jsonschema>=4.23"]

[project.scripts]
pawmarvel-static-print = "pawmarvel_static_print.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pawmarvel_static_print = ["static/*.html", "static/*.js", "static/*.css"]
